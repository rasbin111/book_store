name: Python package

on:
  push:
    branches:
      - dev

jobs:
  build:

    runs-on: ubuntu-latest
    environment: book_store
    steps:
      - uses: actions/checkout@v5

      - name: "create env files"
        run: |

          echo "VITE_API_BASE_URL=http://localhost:8000" > frontend/.env         

          cat <<EOF > backend/.env
          EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
          EMAIL_HOST=smtp.gmail.com
          EMAIL_PORT=587
          EMAIL_HOST_USER=your-email@gmail.com
          EMAIL_HOST_PASSWORD=your-16-char-app-password
          DEFAULT_FROM_EMAIL=book_store@gmail.com

          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_HOST=postgres_db
          DB_PORT=5432

          CELERY_BROKER=redis://redis:6379/0
          EOF
      
      - name: "Build and run container for backend"
        run: |
          docker compose -f docker-compose-github.yml build  redis celery pytest
          docker compose -f docker-compose-github.yml run redis celery pytest


   